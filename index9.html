<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ball Hit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles9.css">
</head>
<body>
  <main class="shell">

    <!-- Top HUD bar -->
    <header class="hud">
      <div class="stat"><span class="label">Score</span><span class="value" id="hud-score">0</span></div>
      <div class="stat"><span class="label">High score</span><span class="value" id="hud-high">0</span></div>
      <div class="stat"><span class="label">Level</span><span class="value" id="hud-level">1</span></div>
      <div class="stat"><span class="label">Lives</span><span class="value" id="hud-lives" aria-live="polite"></span></div>
    </header>

    <!-- Game stage: canvas plus overlay screens -->
    <section class="stage">
      <canvas id="game" width="800" height="600" aria-label="Ball Hit game board"></canvas>

      <!-- Level-up banner -->
      <div class="banner" id="banner" aria-live="polite"></div>

      <!-- Start screen -->
      <div class="screen" id="screen-start">
        <h1>Ball Hit</h1>
        <p>Clear every block to move up a level.<br>Move the paddle with the mouse or the arrow keys.</p>
        <p class="hint">Click or press Space to launch the ball. P pauses.</p>
        <button class="btn" id="btn-start">Start game</button>
      </div>

      <!-- Game over screen -->
      <div class="screen hidden" id="screen-over">
        <h2>Game over</h2>
        <p>You scored <strong id="over-score">0</strong> and reached level <strong id="over-level">1</strong>.</p>
        <p class="hint" id="over-note"></p>
        <button class="btn" id="btn-restart">Try again</button>
      </div>

      <!-- Victory screen -->
      <div class="screen hidden" id="screen-win">
        <h2>All levels cleared</h2>
        <p>Final score: <strong id="win-score">0</strong></p>
        <p class="hint" id="win-note"></p>
        <button class="btn" id="btn-again">Play again</button>
      </div>
    </section>

  </main>

  <script src="script9.js"></script>
</body>
</html>
